[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logos"
version = "0.1.0"
description = "Logos, a prefix-form language for AI readers, and logosc, its compiler."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logosc = "logos.cli:run"

[tool.setuptools]
packages = ["logos", "runtime"]

[tool.setuptools.package-data]
runtime = ["rt.c", "rt.h"]
